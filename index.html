<div id="app"></div>

<!-- Core: data access, guardrails, planning and the agent loop. No page access here, so it can be tested on its own. -->
<script id="core">
(function (global) {
"use strict";

const DEFAULT_STRATEGY = `Example rule set: a trend filter across five asset classes. Edit it to suit you.

1. Funds: SPY (US shares), EFA (developed-market shares outside the US), IEF (US 7-10 year Treasury bonds), VNQ (US property trusts), DBC (commodities).
2. For each fund, compare its latest daily close with its 200-day simple moving average.
3. Target an equal share of the account (20% each for five funds) in every fund closing above its 200-day average. Target 0% for any fund closing below it; that share stays in cash.
4. Only trade a fund when its current weight is more than 5 percentage points away from its target.
5. Sell before you buy. Whole shares only.
6. If data for a fund is missing or looks wrong, skip that fund and say why. Never guess a price.`;

const FUND_NAMES = {
  SPY: "US shares", EFA: "Developed markets ex-US", IEF: "US Treasuries 7-10y", VNQ: "US property trusts", DBC: "Commodities",
  QQQ: "US tech-heavy shares", TLT: "US Treasuries 20y+", GLD: "Gold", VEA: "Developed markets ex-US", VWO: "Emerging markets",
  AGG: "US bonds", BND: "US bonds", VTI: "US total market", IWM: "US small caps", SHY: "US Treasuries 1-3y"
};

const DEFAULT_RULES = {
  strategy: DEFAULT_STRATEGY,
  universe: ["SPY", "EFA", "IEF", "VNQ", "DBC"],
  benchmark: "SPY",
  limits: {
    maxPositionPct: 25,
    maxOrderPct: 25,
    maxOrderUsd: 30000,
    maxOrdersPerDay: 10,
    maxProposalsPerRun: 10,
    cashReservePct: 2,
    dailyLossHaltPct: 3,
    requireMarketOpen: false
  }
};

const LIMIT_INFO = [
  { key: "maxPositionPct", label: "Largest single holding", unit: "% of account", min: 1, max: 100, step: 1,
    help: "No buy may take one fund above this share of the account." },
  { key: "maxOrderPct", label: "Largest single buy", unit: "% of account", min: 1, max: 100, step: 1,
    help: "Caps each buy as a share of the account." },
  { key: "maxOrderUsd", label: "Largest single buy", unit: "US$", min: 100, max: 1000000, step: 100,
    help: "Caps each buy in dollars, whichever limit is lower." },
  { key: "cashReservePct", label: "Cash kept aside", unit: "% of account", min: 0, max: 50, step: 0.5,
    help: "Buys can't dip into this reserve." },
  { key: "dailyLossHaltPct", label: "Stop buying after a daily drop of", unit: "%", min: 0.5, max: 50, step: 0.5,
    help: "If the account is down this much since yesterday's close, buys are blocked. Sells still go through." },
  { key: "maxOrdersPerDay", label: "Orders per day", unit: "orders", min: 1, max: 100, step: 1,
    help: "Counts every order sent on the current New York trading day." },
  { key: "maxProposalsPerRun", label: "Proposals per run", unit: "orders", min: 1, max: 50, step: 1,
    help: "The agent can't propose more than this in one run." }
];

const FIXED_RULES = [
  "Paper account only. This app has no way to reach a live account.",
  "No borrowing: buys must be covered by cash.",
  "No short selling: sells can't exceed shares held.",
  "Market orders, valid for one trading day.",
  "The agent only proposes. Code checks every order against the limits again just before it's sent."
];

/* ---------- small helpers ---------- */
const num = (x) => { const n = Number(x); return Number.isFinite(n) ? n : NaN; };
const round = (x, dp = 2) => Number.isFinite(x) ? Math.round(x * 10 ** dp) / 10 ** dp : null;
const sum = (arr) => arr.reduce((a, b) => a + b, 0);
const sleepReal = (ms) => new Promise((r) => setTimeout(r, ms));

function usd(n, dp = 2) {
  if (!Number.isFinite(n)) return "—";
  const s = Math.abs(n).toLocaleString("en-AU", { minimumFractionDigits: dp, maximumFractionDigits: dp });
  return (n < 0 ? "−US$" : "US$") + s;
}
function pct(n, dp = 1, signed = false) {
  if (!Number.isFinite(n)) return "—";
  const s = Math.abs(n).toFixed(dp) + "%";
  if (n < 0) return "−" + s;
  return (signed && n > 0 ? "+" : "") + s;
}

function nyDate(d = new Date()) {
  return new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
}
function nyMidnightISO(d = new Date()) {
  const date = nyDate(d);
  let sign = "-", hh = "05", mm = "00";
  try {
    const part = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", timeZoneName: "shortOffset" })
      .formatToParts(d).find((p) => p.type === "timeZoneName");
    const m = part && part.value.match(/GMT([+-])(\d{1,2})(?::(\d{2}))?/);
    if (m) { sign = m[1]; hh = m[2].padStart(2, "0"); mm = m[3] || "00"; }
  } catch (e) { /* keep EST default */ }
  return `${date}T00:00:00${sign}${hh}:${mm}`;
}

class AppError extends Error {
  constructor(service, status, message) { super(message); this.service = service; this.status = status; }
}

function explainError(e) {
  if (!(e instanceof AppError)) return (e && e.message) || String(e);
  const svc = { trading: "Alpaca's trading service", data: "Alpaca's market-data service", claude: "the Claude API" }[e.service] || e.service;
  if (e.status === "network") {
    return e.service === "data"
      ? `This browser couldn't reach ${svc}. If the connection check shows this for market data only, set up the relay described in the setup notes and enter its address in Settings.`
      : `This browser couldn't reach ${svc}. Check the internet connection, then run the connection check in Settings.`;
  }
  if (e.service === "claude") {
    if (e.status === 401) return "The Claude API key was rejected. Paste it again in Settings.";
    if (e.status === 404) return `The model name wasn't recognised (${e.message}). Check the model in Settings.`;
    if (e.status === 429) return "The Claude API is rate-limiting this key. Wait a minute and run again.";
    if (e.status === 529 || e.status === 503) return "The Claude API is busy right now. Try again in a few minutes.";
    return `The Claude API returned an error (${e.status}): ${e.message}`;
  }
  if (e.status === 401 || e.status === 403) {
    return `${svc} rejected the keys (${e.status}). Use the Key ID and Secret from your Alpaca paper account; live-account keys don't work here.`;
  }
  if (e.status === 422) return `${svc} refused the request: ${e.message}`;
  if (e.status === 429) return `${svc} is rate-limiting requests. Wait a minute and try again.`;
  return `${svc} returned an error (${e.status}): ${e.message}`;
}

/* ---------- indicators ---------- */
function sma(closes, n) {
  if (closes.length < n) return null;
  return sum(closes.slice(-n)) / n;
}
function retOver(closes, k) {
  if (closes.length <= k) return null;
  const a = closes[closes.length - 1 - k], b = closes[closes.length - 1];
  return a > 0 ? (b / a - 1) * 100 : null;
}
function indicators(bars, latest) {
  const closes = (bars || []).map((b) => num(b.c)).filter((c) => c > 0);
  const last = closes.length ? closes[closes.length - 1] : null;
  const s200 = sma(closes, 200), s50 = sma(closes, 50);
  return {
    last_close: round(last, 4),
    last_close_date: bars && bars.length ? String(bars[bars.length - 1].t).slice(0, 10) : null,
    latest_trade_price: latest && latest.price ? round(latest.price, 4) : null,
    sma_50: round(s50, 4),
    sma_200: round(s200, 4),
    pct_vs_sma_200: s200 && last ? round((last / s200 - 1) * 100, 2) : null,
    return_1m_pct: round(retOver(closes, 21), 2),
    return_3m_pct: round(retOver(closes, 63), 2),
    return_12m_pct: round(retOver(closes, 252), 2),
    bars_used: closes.length
  };
}

/* ---------- guardrails (hard limits the model cannot change) ---------- */
function posMap(positions) {
  const m = {};
  for (const p of positions || []) m[p.symbol] = p;
  return m;
}

function checkOrder(order, c) {
  const L = c.limits;
  const checks = [];
  const add = (id, pass, detail) => checks.push({ id, pass: !!pass, detail });
  const sym = String(order.symbol || "").toUpperCase();
  const side = order.side;
  const qty = num(order.qty);
  const price = num(c.price);
  const priceOk = price > 0;
  const value = priceOk && qty > 0 ? price * qty : NaN;
  const equity = num(c.account.equity);
  const cash = num(c.account.cash);
  const lastEquity = num(c.account.lastEquity);
  const pos = c.positions[sym] || { qty: 0, marketValue: 0 };
  const queued = c.queued || [];
  const qVal = (x) => num(x.qty) * num(x.price != null ? x.price : x.estPrice);

  add("trading_on", c.tradingEnabled, c.tradingEnabled ? "Trading switch is on" : "Trading switch is off");
  add("allowed", c.allowed.includes(sym), c.allowed.includes(sym) ? `${sym} is on your allowed list` : `${sym || "This symbol"} isn't on your allowed list`);
  add("side", side === "buy" || side === "sell", side === "buy" || side === "sell" ? `Side is ${side}` : `Unknown side "${side}"`);
  add("qty", Number.isInteger(qty) && qty > 0, Number.isInteger(qty) && qty > 0 ? `${qty} whole shares` : `Quantity must be a whole number above 0 (got ${order.qty})`);
  if (L.requireMarketOpen) add("market_open", c.marketOpen, c.marketOpen ? "US market is open" : "US market is closed and your limits require it to be open");
  add("price", priceOk, priceOk ? `App price ${usd(price)}` : "No live price from Alpaca for this fund");

  if (side === "sell") {
    const queuedSell = sum(queued.filter((x) => x.symbol === sym && x.side === "sell").map((x) => num(x.qty)));
    const free = num(pos.qty) - queuedSell;
    add("no_short", qty <= free,
      `Holds ${num(pos.qty) || 0} shares${queuedSell ? `, ${queuedSell} already lined up to sell` : ""}; selling ${qty}`);
  }
  if (side === "buy") {
    const proceeds = sum(queued.filter((x) => x.side === "sell").map(qVal));
    const spend = sum(queued.filter((x) => x.side === "buy").map(qVal));
    const reserve = equity * L.cashReservePct / 100;
    const avail = cash + proceeds - spend - reserve;
    add("cash", priceOk && value <= avail, `Costs about ${usd(value, 0)}; cash available after the ${L.cashReservePct}% reserve is ${usd(avail, 0)}`);
    const cap = Math.min(equity * L.maxOrderPct / 100, L.maxOrderUsd);
    add("order_size", priceOk && value <= cap, `Buy of ${usd(value, 0)} against a cap of ${usd(cap, 0)}`);
    const symQueuedNet = sum(queued.filter((x) => x.symbol === sym).map((x) => (x.side === "buy" ? 1 : -1) * qVal(x)));
    const afterPct = equity > 0 ? (num(pos.marketValue || 0) + symQueuedNet + value) / equity * 100 : NaN;
    add("position_cap", priceOk && afterPct <= L.maxPositionPct, `${sym} would be ${pct(afterPct)} of the account (limit ${L.maxPositionPct}%)`);
    const day = lastEquity > 0 ? (equity / lastEquity - 1) * 100 : 0;
    add("daily_loss", day > -L.dailyLossHaltPct, `Account is ${pct(day, 2, true)} today (buys stop at −${L.dailyLossHaltPct}%)`);
  }
  const countAfter = num(c.ordersToday) + num(c.pendingCount || 0) + 1;
  add("daily_count", countAfter <= L.maxOrdersPerDay, `This would be order ${countAfter} of ${L.maxOrdersPerDay} allowed today`);
  return { ok: checks.every((x) => x.pass), checks };
}

/* ---------- rebalance arithmetic (so the model doesn't do sums) ---------- */
function planRebalance({ targets, driftPct, equity, positions, prices, universe, reservePct }) {
  const orders = [], notes = [];
  const want = {};
  for (const [k, v] of Object.entries(targets || {})) want[String(k).toUpperCase()] = num(v);
  const scale = (100 - reservePct) / 100;
  const syms = [...new Set([...universe, ...Object.keys(want)])];
  const totalTarget = sum(universe.map((s) => (Number.isFinite(want[s]) ? want[s] : 0)));
  if (totalTarget > 100.0001) notes.push(`Targets add up to ${round(totalTarget, 1)}%, more than 100%. Buys beyond available cash will be blocked.`);
  for (const sym of syms) {
    if (!universe.includes(sym)) { notes.push(`${sym} isn't on the allowed list, so it was ignored.`); continue; }
    const t = Number.isFinite(want[sym]) ? want[sym] : 0;
    if (!(sym in want)) notes.push(`${sym} had no target, so 0% was assumed.`);
    const price = num(prices[sym]);
    const pos = positions[sym] || { qty: 0, marketValue: 0 };
    const curW = equity > 0 ? num(pos.marketValue || 0) / equity * 100 : 0;
    if (!(price > 0)) { notes.push(`${sym}: no price available, so it was skipped.`); continue; }
    if (Math.abs(curW - t) <= driftPct) {
      notes.push(`${sym}: ${pct(curW)} now vs ${pct(t)} target, inside the ${driftPct}-point band. No trade.`);
      continue;
    }
    const targetVal = t / 100 * equity * scale;
    const delta = targetVal - num(pos.marketValue || 0);
    let side, qty;
    if (delta < 0) { side = "sell"; qty = t === 0 ? Math.floor(num(pos.qty)) : Math.min(Math.floor(num(pos.qty)), Math.floor(-delta / price)); }
    else { side = "buy"; qty = Math.floor(delta / price); }
    if (!(qty > 0)) { notes.push(`${sym}: the gap is smaller than one share. No trade.`); continue; }
    orders.push({ symbol: sym, side, qty, est_price: round(price, 4), est_value: round(qty * price, 2),
      current_weight_pct: round(curW, 2), target_weight_pct: t });
  }
  orders.sort((a, b) => (a.side === "sell" ? 0 : 1) - (b.side === "sell" ? 0 : 1));
  if (reservePct > 0) notes.push(`Targets were applied to ${100 - reservePct}% of equity to keep the ${reservePct}% cash reserve.`);
  return { orders, notes };
}

/* ---------- Alpaca paper client (REST) ---------- */
function AlpacaBroker(cfg) {
  const relay = (cfg.relay || "").trim().replace(/\/+$/, "");
  const T = relay ? relay + "/trading" : "https://paper-api.alpaca.markets";
  const D = relay ? relay + "/data" : "https://data.alpaca.markets";
  const doFetch = cfg.fetch || ((...a) => global.fetch(...a));
  async function req(base, path, opts = {}) {
    const service = base === D ? "data" : "trading";
    let r;
    try {
      const headers = { "APCA-API-KEY-ID": cfg.keyId, "APCA-API-SECRET-KEY": cfg.secret };
      if (opts.body) headers["Content-Type"] = "application/json";
      r = await doFetch(base + path, { method: opts.method || "GET", headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
    } catch (e) {
      throw new AppError(service, "network", e.message);
    }
    const text = await r.text();
    let j = null;
    try { j = text ? JSON.parse(text) : null; } catch (e) { j = { message: text }; }
    if (!r.ok) throw new AppError(service, r.status, (j && (j.message || j.msg)) || text || r.statusText);
    return j;
  }
  return {
    kind: "paper",
    async account() {
      const a = await req(T, "/v2/account");
      return { equity: num(a.equity), cash: num(a.cash), lastEquity: num(a.last_equity), buyingPower: num(a.buying_power),
        blocked: !!(a.trading_blocked || a.account_blocked), currency: a.currency || "USD" };
    },
    async positions() {
      const p = await req(T, "/v2/positions");
      return (p || []).map((x) => ({ symbol: x.symbol, qty: num(x.qty), marketValue: num(x.market_value),
        avgEntry: num(x.avg_entry_price), price: num(x.current_price), plPct: num(x.unrealized_plpc) * 100, pl: num(x.unrealized_pl) }));
    },
    async clock() {
      const c = await req(T, "/v2/clock");
      return { isOpen: !!c.is_open, nextOpen: c.next_open, nextClose: c.next_close, now: c.timestamp };
    },
    async bars(symbols, days = 400) {
      const start = new Date(Date.now() - days * 86400000).toISOString().slice(0, 10);
      const out = {};
      let token = null;
      for (let page = 0; page < 20; page++) {
        const q = `/v2/stocks/bars?symbols=${encodeURIComponent(symbols.join(","))}&timeframe=1Day&start=${start}&limit=10000&adjustment=all` +
          (token ? `&page_token=${encodeURIComponent(token)}` : "");
        const j = await req(D, q);
        for (const [s, arr] of Object.entries((j && j.bars) || {})) out[s] = (out[s] || []).concat(arr.map((b) => ({ t: b.t, c: num(b.c) })));
        token = j && j.next_page_token;
        if (!token) break;
      }
      return out;
    },
    async latestPrices(symbols) {
      const j = await req(D, `/v2/stocks/trades/latest?symbols=${encodeURIComponent(symbols.join(","))}&feed=iex`);
      const out = {};
      for (const [s, t] of Object.entries((j && j.trades) || {})) out[s] = { price: num(t.p), time: t.t };
      return out;
    },
    async ordersToday() {
      const j = await req(T, `/v2/orders?status=all&limit=500&after=${encodeURIComponent(nyMidnightISO())}`);
      return (j || []).length;
    },
    async submit(o) {
      const j = await req(T, "/v2/orders", { method: "POST", body: { symbol: o.symbol, qty: String(o.qty), side: o.side,
        type: "market", time_in_force: "day", client_order_id: o.clientId } });
      return { id: j.id, status: j.status };
    },
    async order(id) {
      const j = await req(T, `/v2/orders/${encodeURIComponent(id)}`);
      return { id: j.id, status: j.status, filledQty: num(j.filled_qty), filledPrice: j.filled_avg_price ? num(j.filled_avg_price) : null };
    },
    async history() {
      const j = await req(T, "/v2/account/portfolio/history?period=3M&timeframe=1D");
      return { timestamps: (j && j.timestamp) || [], equity: (j && j.equity) || [] };
    }
  };
}

/* ---------- demo broker: simulated prices and fills, nothing leaves the device ---------- */
function mulberry32(a) {
  return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function SimBroker(seed = 11) {
  const rnd = mulberry32(seed);
  const specs = { SPY: [430, 0.0011], EFA: [70, 0.0008], IEF: [99, -0.0004], VNQ: [94, -0.0006], DBC: [21, 0.0009],
    QQQ: [380, 0.0012], TLT: [92, -0.0005], GLD: [190, 0.0010], VEA: [46, 0.0007], VWO: [41, 0.0004], AGG: [97, -0.0001] };
  const N = 300, series = {};
  const days = [];
  { const d = new Date(); d.setUTCHours(4, 0, 0, 0);
    while (days.length < N) { const wd = d.getUTCDay(); if (wd !== 0 && wd !== 6) days.unshift(d.toISOString()); d.setUTCDate(d.getUTCDate() - 1); } }
  function make(sym) {
    const [p0, drift] = specs[sym] || [50 + Math.floor(rnd() * 100), 0.0003];
    const ph = rnd() * 6;
    series[sym] = days.map((t, i) => ({ t, c: round(p0 * (1 + drift * i) * (1 + 0.012 * Math.sin(i / 9 + ph) + 0.005 * (rnd() - 0.5)), 2) }));
  }
  const last = (sym) => { if (!series[sym]) make(sym); return series[sym][N - 1].c; };
  const live = {};
  const price = (sym) => { if (!(sym in live)) live[sym] = round(last(sym) * (1 + 0.002 * (rnd() - 0.4)), 2); return live[sym]; };
  const startEquity = 100000;
  const hold = { SPY: 0.12, EFA: 0.21, VNQ: 0.19, IEF: 0.03 };
  const pos = {};
  let cash = startEquity;
  for (const [s, w] of Object.entries(hold)) { const q = Math.floor(startEquity * w / price(s)); pos[s] = { qty: q, avg: round(price(s) * (0.9 + rnd() * 0.14), 2) }; cash -= q * price(s); }
  cash = round(cash, 2);
  let orders = 0, n = 0;
  const filled = {};
  const equityNow = () => cash + sum(Object.entries(pos).map(([s, p]) => p.qty * price(s)));
  return {
    kind: "demo",
    async account() { const e = equityNow(); return { equity: round(e, 2), cash, lastEquity: round(e * 1.0035, 2), buyingPower: cash, blocked: false, currency: "USD" }; },
    async positions() {
      return Object.entries(pos).filter(([, p]) => p.qty > 0).map(([s, p]) => ({ symbol: s, qty: p.qty, marketValue: round(p.qty * price(s), 2),
        avgEntry: p.avg, price: price(s), pl: round(p.qty * (price(s) - p.avg), 2), plPct: (price(s) / p.avg - 1) * 100 }));
    },
    async clock() { const now = Date.now(); return { isOpen: true, nextOpen: new Date(now + 19 * 3600e3).toISOString(), nextClose: new Date(now + 2.5 * 3600e3).toISOString(), now: new Date(now).toISOString() }; },
    async bars(symbols) { const out = {}; for (const s of symbols) { last(s); out[s] = series[s].slice(); } return out; },
    async latestPrices(symbols) { const out = {}; for (const s of symbols) out[s] = { price: price(s), time: new Date().toISOString() }; return out; },
    async ordersToday() { return orders; },
    async submit(o) {
      const p = price(o.symbol); const id = "demo-" + (++n);
      if (o.side === "buy") { cash = round(cash - o.qty * p, 2); const cur = pos[o.symbol] || { qty: 0, avg: p };
        cur.avg = round((cur.avg * cur.qty + p * o.qty) / (cur.qty + o.qty), 2); cur.qty += o.qty; pos[o.symbol] = cur; }
      else { cash = round(cash + o.qty * p, 2); pos[o.symbol].qty -= o.qty; }
      orders++; filled[id] = p;
      return { id, status: "filled" };
    },
    async order(id) { return { id, status: "filled", filledQty: null, filledPrice: filled[id] || null }; },
    async history() {
      const pts = days.slice(-63); const spy = series.SPY ? series.SPY.slice(-63) : (last("SPY"), series.SPY.slice(-63));
      const e = equityNow();
      return { timestamps: pts.map((t) => Math.floor(Date.parse(t) / 1000)),
        equity: spy.map((b, i) => round(e * (1 - 0.045 * (62 - i) / 62) * (1 + 0.006 * Math.sin(i / 5)), 2)) };
    }
  };
}

/* ---------- agent: tools and loop ---------- */
const TOOLS = [
  { name: "get_account", description: "Account snapshot the app took at the start of this run: equity, cash, change since yesterday's close, US market status, and orders already sent today. Amounts are US dollars.",
    input_schema: { type: "object", properties: {} } },
  { name: "get_positions", description: "Current holdings: shares, market value, weight as a percentage of equity, and unrealised gain or loss.",
    input_schema: { type: "object", properties: {} } },
  { name: "get_market_data", description: "Daily indicators the app computed from about 400 calendar days of split- and dividend-adjusted daily bars: last close and its date, latest trade price, 50- and 200-day simple moving averages, last close versus the 200-day average in percent, and 1-, 3- and 12-month returns. Only funds on the allowed list or the benchmark are available.",
    input_schema: { type: "object", properties: { symbols: { type: "array", items: { type: "string" } } }, required: ["symbols"] } },
  { name: "plan_rebalance", description: "Turns target weights into whole-share orders using the app's own arithmetic and prices. Give a target weight (percent of equity) for every allowed fund, including 0 for funds to hold none of. The app sets aside the cash reserve, skips funds inside the drift band, and lists sells first. It does not propose or place anything.",
    input_schema: { type: "object", properties: {
      targets: { type: "object", additionalProperties: { type: "number" }, description: "Symbol to target weight percent, for example {\"SPY\": 20, \"IEF\": 0}" },
      drift_threshold_pct: { type: "number", description: "Skip funds whose current weight is within this many percentage points of target" } },
      required: ["targets", "drift_threshold_pct"] } },
  { name: "propose_order", description: "Put one market order in front of the user for approval. The app first checks it against hard limits (allowed funds, no short selling, no borrowing, size caps, daily limits) using its own prices. A blocked order stays blocked for this run.",
    input_schema: { type: "object", properties: {
      symbol: { type: "string" }, side: { type: "string", enum: ["buy", "sell"] }, qty: { type: "integer", minimum: 1 },
      reason: { type: "string", description: "One sentence citing the rule and the numbers behind it" } },
      required: ["symbol", "side", "qty", "reason"] } }
];

const SYSTEM_PROMPT = `You are the execution agent for a paper-trading account (simulated money). You apply the user's written rules exactly, using only the tools provided.

How this works:
- The app took a snapshot of the account, holdings and prices at the start of this run. Read it through the tools. Never invent or estimate a price.
- You cannot place orders. propose_order puts an order in front of the user after code checks it against hard limits. If a proposal is blocked, do not resize or re-propose it to get around the limit; report it.
- Use plan_rebalance for order quantities instead of doing the arithmetic yourself.

Steps: read the account and holdings, get market data for the allowed funds, decide each fund's target weight under the rules, call plan_rebalance, then propose the orders it returns that the rules support. Finish with a plain-English summary of four sentences or fewer: what you proposed and why, what you left alone, and anything blocked or missing.`;

function buildBrief(run, rules) {
  return `Date in New York: ${nyDate()}. US market: ${run.ctx.clock.isOpen ? "open" : "closed (orders would wait for the next open)"}.
Allowed funds: ${rules.universe.join(", ")}. Benchmark: ${rules.benchmark}.

The user's rules:
<rules>
${rules.strategy}
</rules>

Apply the rules now.`;
}

// Load the snapshot the guardrails rely on. The model never supplies prices or balances.
async function loadSnapshot(broker, rules) {
  const syms = [...new Set([...rules.universe, rules.benchmark])];
  const [account, positions, clock, ordersToday, latest] = await Promise.all([
    broker.account(), broker.positions(), broker.clock(), broker.ordersToday(), broker.latestPrices(rules.universe)
  ]);
  return { account, positions, posMap: posMap(positions), clock, ordersToday, latest, syms, bars: null };
}

function proposalPrice(ctx, sym) {
  const l = ctx.latest[sym];
  if (l && l.price > 0) return l.price;
  const b = ctx.bars && ctx.bars[sym];
  return b && b.length ? b[b.length - 1].c : NaN;
}

async function executeTool(name, input, run, env) {
  const { broker, rules, settings } = env;
  const ctx = run.ctx;
  const L = rules.limits;
  input = input || {};
  switch (name) {
    case "get_account": {
      const a = ctx.account;
      return { equity: a.equity, cash: a.cash, previous_close_equity: a.lastEquity,
        change_today_pct: a.lastEquity > 0 ? round((a.equity / a.lastEquity - 1) * 100, 2) : null,
        market_open: ctx.clock.isOpen, next_open: ctx.clock.nextOpen, next_close: ctx.clock.nextClose,
        orders_sent_today: ctx.ordersToday, account_blocked: a.blocked };
    }
    case "get_positions": {
      const eq = ctx.account.equity;
      return ctx.positions.map((p) => ({ symbol: p.symbol, shares: p.qty, market_value: round(p.marketValue, 2),
        weight_pct: eq > 0 ? round(p.marketValue / eq * 100, 2) : null, avg_entry_price: round(p.avgEntry, 4),
        unrealized_pl_pct: round(p.plPct, 2), on_allowed_list: rules.universe.includes(p.symbol) }));
    }
    case "get_market_data": {
      const asked = [...new Set((input.symbols || []).map((s) => String(s).toUpperCase()))];
      const ok = asked.filter((s) => ctx.syms.includes(s));
      const refused = asked.filter((s) => !ctx.syms.includes(s));
      if (!ctx.bars) ctx.bars = await broker.bars(ctx.syms, 400);
      const data = {};
      for (const s of ok) {
        const bars = ctx.bars[s];
        data[s] = bars && bars.length ? indicators(bars, ctx.latest[s]) : { error: "No daily bars returned for this fund" };
      }
      return refused.length ? { data, refused: refused.map((s) => `${s} is not on the allowed list or the benchmark`) } : { data };
    }
    case "plan_rebalance": {
      const prices = {};
      for (const s of rules.universe) prices[s] = proposalPrice(ctx, s);
      const drift = Number.isFinite(num(input.drift_threshold_pct)) ? Math.max(0, num(input.drift_threshold_pct)) : 5;
      const plan = planRebalance({ targets: input.targets, driftPct: drift, equity: ctx.account.equity, positions: ctx.posMap,
        prices, universe: rules.universe, reservePct: L.cashReservePct });
      run.targets = {};
      for (const s of rules.universe) run.targets[s] = Number.isFinite(num((input.targets || {})[s])) ? num(input.targets[s]) : 0;
      return plan;
    }
    case "propose_order": {
      const sym = String(input.symbol || "").toUpperCase();
      const q = Number(input.qty);
      const p = { id: run.proposals.length + 1, symbol: sym, side: input.side, qty: Number.isFinite(q) ? q : input.qty,
        reason: String(input.reason || "").slice(0, 500), estPrice: proposalPrice(ctx, sym), checks: [], status: "queued" };
      if (run.proposals.length >= L.maxProposalsPerRun) {
        p.status = "blocked";
        p.checks = [{ id: "run_count", pass: false, detail: `Limit of ${L.maxProposalsPerRun} proposals per run reached` }];
      } else {
        const queued = run.proposals.filter((x) => x.status === "queued");
        const v = checkOrder(p, { limits: L, allowed: rules.universe, account: ctx.account, positions: ctx.posMap, price: p.estPrice,
          ordersToday: ctx.ordersToday, pendingCount: queued.length, queued, marketOpen: ctx.clock.isOpen, tradingEnabled: settings.tradingEnabled });
        p.checks = v.checks;
        p.status = v.ok ? "queued" : "blocked";
      }
      run.proposals.push(p);
      const failed = p.checks.filter((c) => !c.pass).map((c) => c.detail);
      return p.status === "queued"
        ? { status: "queued", message: "Passed all checks. Waiting for the user's approval." }
        : { status: "blocked", failed_checks: failed, message: "Blocked by a hard limit. Do not try to work around it; mention it in your summary." };
    }
    default:
      throw new Error(`Unknown tool ${name}`);
  }
}

function describeCall(name, input, result) {
  const i = input || {};
  switch (name) {
    case "get_account": return "Read the account balance";
    case "get_positions": return "Read current holdings";
    case "get_market_data": return `Pulled daily prices for ${(i.symbols || []).join(", ")}`;
    case "plan_rebalance": {
      const t = Object.entries(i.targets || {}).map(([k, v]) => `${k} ${v}%`).join(", ");
      const n = result && result.orders ? result.orders.length : 0;
      return `Worked out orders for targets ${t}: ${n} order${n === 1 ? "" : "s"}`;
    }
    case "propose_order": {
      const head = `Proposed ${String(i.side || "").toUpperCase()} ${i.qty} ${String(i.symbol || "").toUpperCase()}`;
      return result && result.status === "blocked" ? `${head}: blocked (${(result.failed_checks || []).join("; ")})` : head;
    }
    default: return name;
  }
}

async function runClaudeAgent(run, env, hooks) {
  const doFetch = env.fetch || ((...a) => global.fetch(...a));
  const messages = [{ role: "user", content: buildBrief(run, env.rules) }];
  for (let turn = 0; turn < 16; turn++) {
    let r, j;
    try {
      r = await doFetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "content-type": "application/json", "x-api-key": env.settings.anthropicKey,
          "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify({ model: env.settings.model, max_tokens: 2048, system: SYSTEM_PROMPT, tools: TOOLS, messages })
      });
    } catch (e) { throw new AppError("claude", "network", e.message); }
    try { j = await r.json(); } catch (e) { j = null; }
    if (!r.ok) throw new AppError("claude", r.status, (j && j.error && j.error.message) || `HTTP ${r.status}`);
    if (j.usage) { run.usage.input += j.usage.input_tokens || 0; run.usage.output += j.usage.output_tokens || 0; }
    messages.push({ role: "assistant", content: j.content });
    const texts = j.content.filter((b) => b.type === "text").map((b) => b.text.trim()).filter(Boolean);
    const uses = j.content.filter((b) => b.type === "tool_use");
    if (!uses.length || j.stop_reason !== "tool_use") {
      run.summary = texts.join("\n\n");
      return;
    }
    for (const t of texts) hooks.step({ kind: "note", text: t });
    const results = [];
    for (const u of uses) {
      let out, isErr = false;
      try { out = await executeTool(u.name, u.input, run, env); }
      catch (e) { out = { error: explainError(e) }; isErr = true; }
      hooks.step({ kind: u.name === "propose_order" && out.status === "blocked" ? "block" : "tool", text: isErr ? `${u.name} failed: ${out.error}` : describeCall(u.name, u.input, out) });
      results.push({ type: "tool_result", tool_use_id: u.id, content: JSON.stringify(out), ...(isErr ? { is_error: true } : {}) });
    }
    messages.push({ role: "user", content: results });
  }
  run.summary = "Stopped after 16 turns without finishing. Review the steps above.";
}

// Demo-only walk-through of the example rule, so the screens can be explored without a Claude key.
async function runScriptedAgent(run, env, hooks) {
  const call = async (name, input) => {
    const out = await executeTool(name, input, run, env);
    hooks.step({ kind: name === "propose_order" && out.status === "blocked" ? "block" : "tool", text: describeCall(name, input, out) });
    return out;
  };
  const U = env.rules.universe;
  await call("get_account", {});
  await call("get_positions", {});
  const md = (await call("get_market_data", { symbols: U })).data;
  const each = round(100 / U.length, 2);
  const targets = {};
  for (const s of U) targets[s] = md[s] && md[s].pct_vs_sma_200 != null && md[s].pct_vs_sma_200 > 0 ? each : 0;
  const plan = await call("plan_rebalance", { targets, drift_threshold_pct: 5 });
  for (const o of plan.orders) {
    const m = md[o.symbol];
    await call("propose_order", { symbol: o.symbol, side: o.side, qty: o.qty,
      reason: `${o.symbol} closed ${pct(Math.abs(m.pct_vs_sma_200), 1)} ${m.pct_vs_sma_200 > 0 ? "above" : "below"} its 200-day average, so its target is ${o.target_weight_pct}% (now ${o.current_weight_pct}%).` });
  }
  const above = U.filter((s) => targets[s] > 0), below = U.filter((s) => targets[s] === 0);
  run.summary = `Scripted demo following the example rule, with no AI involved. Above their 200-day averages: ${above.join(", ") || "none"}. Below: ${below.join(", ") || "none"}. ` +
    `${plan.orders.length} order${plan.orders.length === 1 ? "" : "s"} proposed; funds already within 5 points of target were left alone. Add a Claude API key in Settings to run the real agent.`;
}

async function sendApproved(run, env, hooks) {
  const sleep = env.sleep || sleepReal;
  const list = run.proposals.filter((p) => p.status === "approved")
    .sort((a, b) => (a.side === "sell" ? 0 : 1) - (b.side === "sell" ? 0 : 1));
  const pending = [];
  for (const p of list) {
    let account, positions, clock, ordersToday, latest;
    try {
      [account, positions, clock, ordersToday, latest] = await Promise.all([
        env.broker.account(), env.broker.positions(), env.broker.clock(), env.broker.ordersToday(), env.broker.latestPrices([p.symbol])
      ]);
    } catch (e) { p.status = "failed"; p.error = explainError(e); hooks.update(); continue; }
    const price = latest[p.symbol] ? latest[p.symbol].price : NaN;
    const v = checkOrder(p, { limits: env.rules.limits, allowed: env.rules.universe, account, positions: posMap(positions), price,
      ordersToday, pendingCount: 0, queued: pending, marketOpen: clock.isOpen, tradingEnabled: env.settings.tradingEnabled });
    p.sendChecks = v.checks;
    if (!v.ok) { p.status = "blocked"; p.blockedAtSend = true; hooks.update(); continue; }
    try {
      const o = await env.broker.submit({ symbol: p.symbol, side: p.side, qty: p.qty, clientId: `ptd-${run.id}-${p.id}` });
      p.orderId = o.id; p.status = "sent"; p.sentAt = new Date().toISOString(); p.sendPrice = price;
      hooks.update();
      let filled = o.status === "filled";
      if (!filled && clock.isOpen) {
        for (let k = 0; k < 15 && !filled; k++) {
          await sleep(1000);
          const s = await env.broker.order(o.id);
          if (s.status === "filled") { filled = true; p.fillPrice = s.filledPrice; }
          else if (["canceled", "rejected", "expired"].includes(s.status)) { p.status = "failed"; p.error = `Alpaca reports the order ${s.status}`; break; }
        }
      }
      if (filled) { p.status = "filled"; if (!p.fillPrice) { try { p.fillPrice = (await env.broker.order(o.id)).filledPrice; } catch (e) { /* not essential */ } } }
      else if (p.status === "sent") pending.push({ symbol: p.symbol, side: p.side, qty: p.qty, price });
    } catch (e) { p.status = "failed"; p.error = explainError(e); }
    hooks.update();
  }
}

/* ---------- agent run ---------- */
async function runAgent() {
  if (S.running) return;

  const run = { id: Date.now().toString(36), startedAt: new Date().toISOString(), mode: isDemo() ? "demo" : "paper",
    agent: useClaude ? "claude" : "scripted", model: useClaude ? S.settings.model : null,
    steps: [], proposals: [], summary: "", usage: { input: 0, output: 0 }, error: null, targets: null };

}
function persistRun(run) {

function chart(pts) {
  const narrow = window.innerWidth < 560;
  const W = narrow ? 380 : 640, H = narrow ? 200 : 240, padL = 46, padR = 54, padT = 12, padB = 26;
  const a = pts.map((p) => (p.eq / pts[0].eq - 1) * 100), b = pts.map((p) => (p.b / pts[0].b - 1) * 100);
  let lo = Math.min(...a, ...b, 0), hi = Math.max(...a, ...b, 0);
  const span = hi - lo || 1;
  const step = [0.5, 1, 2, 2.5, 5, 10, 20, 25, 50].find((s) => span / s <= 5) || 100;
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = (i) => padL + i * (W - padL - padR) / (pts.length - 1);
  const y = (v) => padT + (hi - v) * (H - padT - padB) / (hi - lo);
  const path = (arr) => arr.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  let grid = "";
  for (let v = lo; v <= hi + 1e-9; v += step) {
    grid += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="lbl" x="${padL - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${v > 0 ? "+" : ""}${C.round(v, 1)}%</text>`;
  }
  const fmtD = (d) => new Date(d + "T12:00:00Z").toLocaleDateString("en-AU", { day: "numeric", month: "short", timeZone: "UTC" });
  const mid = Math.floor((pts.length - 1) / 2);
  const xl = [0, mid, pts.length - 1].map((i) => `<text class="lbl" x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle"}">${fmtD(pts[i].d)}</text>`).join("");
  const n = pts.length - 1;
  const area = `${path(a)}L${x(n).toFixed(1)},${y(Math.max(lo, 0)).toFixed(1)}L${x(0).toFixed(1)},${y(Math.max(lo, 0)).toFixed(1)}Z`;
  const ya = y(a[n]), yb = y(b[n]);
  const sep = Math.abs(ya - yb) < 14 ? (ya < yb ? -7 : 7) : 0;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Account return ${C.pct(a[n], 1, true)} versus ${esc(S.rules.benchmark)} ${C.pct(b[n], 1, true)}">
    ${grid}<path class="area" d="${area}"/><path class="bench" d="${path(b)}"/><path class="acct" d="${path(a)}"/>
    <circle class="endpt" cx="${x(n).toFixed(1)}" cy="${ya.toFixed(1)}" r="3.5"/>
    <text class="lbl" x="${W - padR + 6}" y="${(ya + 4 + sep).toFixed(1)}" style="fill:var(--accent);font-weight:600">${C.pct(a[n], 1, true)}</text>
    <text class="lbl" x="${W - padR + 6}" y="${(yb + 4 - sep).toFixed(1)}">${C.pct(b[n], 1, true)}</text>${xl}</svg>
    <div class="legend"><span><i></i>Your account</span><span><i class="b"></i>${esc(S.rules.benchmark)}, held throughout</span></div>`;
}

function proposalCard(p, interactive) {
  const val = Number.isFinite(p.estPrice) ? `≈ ${C.usd(p.estPrice * p.qty, 0)} at ${C.usd(p.estPrice)}` : "";
  const checks = p.sendChecks || p.checks || [];
  const failed = checks.filter((c) => !c.pass);
  const stale = !interactive && (p.status === "queued" || p.status === "approved");
  const statusLabel = stale ? "Not sent" : { queued: "Needs approval", approved: "Approved", rejected: "Rejected", blocked: p.blockedAtSend ? "Blocked at send" : "Blocked",
    sent: "Sent, waiting for fill", filled: p.fillPrice ? `Filled at ${C.usd(p.fillPrice)}` : "Filled", failed: "Failed" }[p.status] || p.status;
  const canChoose = interactive && (p.status === "queued" || p.status === "approved" || p.status === "rejected");
  return `<article class="prop ${p.status === "blocked" ? "blocked" : ""}">
    <div class="prop-head"><span class="side ${p.side === "sell" ? "sell" : "buy"}">${esc(String(p.side).toUpperCase())}</span>
      <span class="prop-title">${esc(p.qty)} ${esc(p.symbol)}</span><span class="prop-est num">${esc(val)}</span>
      <span class="status ${esc(p.status)}">${esc(statusLabel)}</span></div>
    <p class="reason">${esc(p.reason)}</p>
    ${failed.length ? `<ul class="fails">${failed.map((c) => `<li>${esc(c.detail)}</li>`).join("")}</ul>` : ""}
    ${p.error ? `<ul class="fails"><li>${esc(p.error)}</li></ul>` : ""}
    ${!failed.length && checks.length ? `<details class="checks"><summary>All ${checks.length} limit checks passed</summary><ul>${checks.map((c) => `<li>${esc(c.detail)}</li>`).join("")}</ul></details>` : ""}
    ${canChoose ? `<div class="choice" role="group" aria-label="Approve or reject">
      <button class="btn yes" data-approve="${p.id}" aria-pressed="${p.status === "approved"}">Approve</button>
      <button class="btn no" data-reject="${p.id}" aria-pressed="${p.status === "rejected"}">Reject</button></div>` : ""}
  </article>`;
}

function agentPanel() {
  const demo = isDemo(), hasKey = !!S.settings.anthropicKey;
  const r = S.run;
  let action;
  if (!hasKey && !demo) action = `<button class="btn primary big" disabled>Run agent</button><p class="caption">Add a Claude API key in <a href="#settings" data-view="settings">Settings</a> to run the agent on your paper account.</p>`;
  else action = `<button class="btn primary big" id="run" ${S.running || S.sending || !S.snap ? "disabled" : ""}>${S.running ? `<span class="spin" aria-hidden="true"></span>Agent working…` : hasKey ? "Run agent" : "Run demo walk-through"}</button>
    <p class="caption">${hasKey ? "Claude reads your rules and the latest prices, then proposes orders. Code checks each one against your limits." : "Demo data with a scripted walk-through of the example rule. No AI is used until you add a Claude key."} ${S.settings.askBeforeSend ? "Nothing is sent until you approve it." : "Orders that pass the checks are sent straight away (you turned approval off in Settings)."}</p>`;
  let body = "";
  if (r) {
    body += `<ol class="steps" aria-live="polite">${r.steps.map((s) => `<li class="${esc(s.kind)}">${esc(s.text)}</li>`).join("")}</ol>`;
    if (r.error) body += `<div class="banner err" style="margin-top:14px"><b>Run stopped.</b><span>${esc(r.error)}</span></div>`;
    if (r.summary) body += `<p class="summary-text">${esc(r.summary)}</p>`;
    if (r.proposals.length) {
      body += `<div class="props">${r.proposals.map((p) => proposalCard(p, !S.running && !S.sending)).join("")}</div>`;
      const approved = r.proposals.filter((p) => p.status === "approved").length;
      const queued = r.proposals.filter((p) => p.status === "queued").length;
      if (!S.running && (approved || queued)) {
        body += `<div class="sendbar">
          ${queued ? `<button class="btn" id="approve-all" ${S.sending ? "disabled" : ""}>Approve all ${queued + approved}</button>` : ""}
          <button class="btn primary big" id="send" ${!approved || S.sending ? "disabled" : ""}>${S.sending ? `<span class="spin" aria-hidden="true"></span>Sending…` : (approved ? `Send ${approved} approved order${approved === 1 ? "" : "s"}` : "Approve orders to send them")}</button>
          <p class="caption">Sells go first. Each order is checked again against fresh prices and balances just before it's sent.</p></div>`;
      }
    } else if (!S.running && !r.error) body += `<p class="caption">No orders proposed this run.</p>`;
    if (r.usage && (r.usage.input || r.usage.output)) body += `<p class="caption">Claude usage this run: ${r.usage.input.toLocaleString()} input and ${r.usage.output.toLocaleString()} output tokens.</p>`;
  }
  return `<section class="panel area-agent" aria-labelledby="h-agent"><h2 id="h-agent">Agent</h2>
    <p class="sub">${hasKey ? `Model: ${esc(S.settings.model)}` : "Scripted demo"} · ${S.rules.universe.length} allowed funds · ${S.settings.tradingEnabled ? "trading on" : "trading paused, every order will be blocked"}</p>
    ${action}${body}</section>`;
}

function deskView() {
  const demo = isDemo();
  let out = "";
  if (demo) out += `<div class="banner"><b>Demo data.</b><span>Prices, holdings and fills here are simulated on this device. Add your Alpaca paper keys in <a href="#settings" data-view="settings">Settings</a> to use your paper account.</span></div>`;
  if (S.error) out += `<div class="banner err"><b>Couldn't load the account.</b><span>${esc(S.error)}</span></div>`;
  if (S.loading && !S.snap) return out + `<p class="empty">Loading account…</p>`;
  if (!S.snap) return out;
  out += summaryStrip();
  out += `<div class="desk"><div class="desk-col">${holdingsPanel()}${perfPanel()}</div><div class="desk-col desk-agent">${agentPanel()}</div></div>`;
  return out;
}

function rulesView() {
  const r = S.rules, L = r.limits;
  const lim = (i) => `<div class="field"><label for="lim-${i.key}">${esc(i.label)}</label>
    <div class="unit"><input type="number" inputmode="decimal" id="lim-${i.key}" min="${i.min}" max="${i.max}" step="${i.step}" value="${esc(L[i.key])}"><span>${esc(i.unit)}</span></div>
    <div class="help">${esc(i.help)}</div></div>`;
  return `<section class="panel sec" aria-labelledby="h-strat"><h2 id="h-strat">Your rules</h2>
      <p class="sub">Written in plain English. Claude follows these. Be specific about numbers, and say what to do when data is missing.</p>
      <div class="field"><label for="strategy">Strategy</label><textarea id="strategy" spellcheck="true">${esc(r.strategy)}</textarea></div>
      <div class="grid2">
        <div class="field"><label for="universe">Funds the agent may trade</label><input type="text" id="universe" autocapitalize="characters" autocorrect="off" spellcheck="false" value="${esc(r.universe.join(", "))}"><div class="help">US-listed tickers, separated by commas. Anything else is blocked.</div></div>
        <div class="field"><label for="benchmark">Benchmark</label><input type="text" id="benchmark" autocapitalize="characters" autocorrect="off" spellcheck="false" value="${esc(r.benchmark)}"><div class="help">What the agent's results are compared with.</div></div>
      </div></section>
    <section class="panel sec" aria-labelledby="h-lim"><h2 id="h-lim">Hard limits</h2>
      <p class="sub">Enforced by code on this page, not by the AI. The agent can't change them, and every order is checked again just before sending.</p>
      <div class="grid2">${C.LIMIT_INFO.map(lim).join("")}</div>
      <label class="check" for="lim-requireMarketOpen"><input type="checkbox" id="lim-requireMarketOpen" ${L.requireMarketOpen ? "checked" : ""}>
        <span><b>Only send orders while the US market is open</b><span>When off, orders sent outside trading hours wait and fill at the next open, at whatever price the market opens at.</span></span></label>
      <div><h2 style="font-size:14px;margin:6px 0">Always on</h2><ul class="locked">${C.FIXED_RULES.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div>
      <div class="row"><button class="btn primary" id="save-rules">Save rules</button><button class="btn danger" id="reset-rules" data-armed="0">Restore example rules</button></div>
    </section>`;
}

function logView() {
  if (!S.log.length) return `<section class="panel"><h2>Log</h2><p class="empty">Each run is recorded here with the agent's reasoning, every proposal, and what was sent. Nothing yet.</p></section>`;
  const runs = S.log.map((r, idx) => {
    const sent = r.proposals.filter((p) => p.status === "filled" || p.status === "sent").length;
    const blocked = r.proposals.filter((p) => p.status === "blocked").length;
    return `<details class="run" ${idx === 0 ? "open" : ""}><summary><span class="when">${esc(fmtWhen(r.startedAt, true))}</span>
      <span class="meta">${r.mode === "demo" ? "Demo" : "Paper"} · ${r.agent === "claude" ? esc(r.model) : "scripted"} · ${r.proposals.length} proposed, ${sent} sent${blocked ? `, ${blocked} blocked` : ""}${r.error ? " · stopped with an error" : ""}</span></summary>
      ${r.error ? `<div class="banner err"><b>Error.</b><span>${esc(r.error)}</span></div>` : ""}
      ${r.summary ? `<p class="summary-text" style="margin-top:0">${esc(r.summary)}</p>` : ""}
      ${r.proposals.length ? `<div class="props">${r.proposals.map((p) => proposalCard(p, false)).join("")}</div>` : ""}
      <details class="checks" style="margin-top:10px"><summary>${r.steps.length} steps${r.usage && r.usage.input ? ` · ${(r.usage.input + r.usage.output).toLocaleString()} tokens` : ""}</summary>
      <ol class="steps">${r.steps.map((s) => `<li class="${esc(s.kind)}">${esc(s.text)}</li>`).join("")}</ol></details></details>`;
  }).join("");
  return `<section class="sec"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Log</h2>
    <div class="row"><button class="btn" id="export-log">Export log</button><button class="btn danger" id="clear-log" data-armed="0">Clear log</button></div></div>
    <p class="sub">Stored on this device only. The latest ${S.log.length} run${S.log.length === 1 ? "" : "s"}, newest first.</p>
    <div class="runs">${runs}</div></section>`;
}

function settingsView() {
  const st = S.settings;
  const f = (id, label, type, help, extra = "") => `<div class="field"><label for="${id}">${label}</label>
    <input type="${type}" id="${id}" value="${esc(st[id])}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" ${extra}>${help ? `<div class="help">${help}</div>` : ""}</div>`;
  const conn = S.conn ? `<ul class="conn" aria-live="polite">${S.conn.map((c) => `<li><span class="${c.ok ? "ok" : "bad"}">${c.ok ? "✓" : "✕"}</span><span><b>${esc(c.label)}.</b> ${esc(c.detail)}</span></li>`).join("")}
    ${S.checking ? `<li><span class="spin" aria-hidden="true"></span><span>Checking…</span></li>` : ""}</ul>` : "";
  return `<section class="panel sec" aria-labelledby="h-alp"><h2 id="h-alp">Alpaca paper account</h2>
      <p class="sub">Create a free Alpaca account, open the paper-trading account, and generate an API key pair there. This app only talks to Alpaca's paper service; live keys won't work.</p>
      <div class="grid2">${f("keyId", "Key ID", "text", "")}${f("secret", "Secret key", "password", "")}</div></section>
    <section class="panel sec" aria-labelledby="h-cl"><h2 id="h-cl">Claude</h2>
      <p class="sub">Create an API key at console.anthropic.com. API use is billed separately from a Claude subscription; the Log shows the tokens each run used.</p>
      <div class="grid2">${f("anthropicKey", "API key", "password", "")}${f("model", "Model", "text", "The default is Claude Sonnet 5.5.")}</div></section>
    <section class="panel sec" aria-labelledby="h-ord"><h2 id="h-ord">How orders go out</h2>
      <label class="check" for="askBeforeSend"><input type="checkbox" id="askBeforeSend" ${st.askBeforeSend ? "checked" : ""}>
        <span><b>Ask me before sending orders</b><span>Recommended. When off, orders that pass every limit are sent as soon as the run ends.</span></span></label>
      <label class="check" for="demo"><input type="checkbox" id="demo" ${st.demo ? "checked" : ""}>
        <span><b>Use demo data</b><span>Simulated prices and fills on this device, even with keys entered. Claude still runs if a key is set.</span></span></label>
      ${f("relay", "Relay address (only if needed)", "url", "Leave blank. Fill in only if the connection check says this browser can't reach Alpaca's market-data service; the setup notes explain the relay.", 'inputmode="url" placeholder="https://…"')}
    </section>
    <section class="panel sec" aria-labelledby="h-save"><h2 id="h-save">Save and check</h2>
      <p class="sub">Keys are kept in this browser on this device only and are never sent to Claude. On iPad, open this page in Safari, tap Share, then Add to Home Screen; it then opens like an app and keeps these settings.</p>
      <div class="row"><button class="btn primary" id="save-settings">Save settings</button><button class="btn" id="check" ${S.checking ? "disabled" : ""}>Check connections</button>
      <button class="btn danger" id="forget" data-armed="0">Forget keys on this device</button></div>${conn}</section>`;
}

let freshForm = false; // set when saved values should replace whatever is typed in the form
function render() {
  const focusId = document.activeElement && document.activeElement.id;
  let view = "";
  if (S.view === "desk") view = deskView();
  else if (S.view === "rules") view = rulesView();
  else if (S.view === "log") view = logView();
  else view = settingsView();
  // Keep unsaved form edits when the page re-renders around them (status updates, connection checks).
  const draft = {};
  if (!freshForm && (S.view === "rules" || S.view === "settings")) {
    $app.querySelectorAll("main input, main textarea").forEach((el) => { if (el.id) draft[el.id] = el.type === "checkbox" ? el.checked : el.value; });
  }
  freshForm = false;
  const openLog = [...$app.querySelectorAll("details.run")].map((d) => d.open);
  const scrollTop = window.scrollY;
  $app.innerHTML = header() + `<main class="wrap" id="main">${view}</main>`;
  for (const [id, v] of Object.entries(draft)) { const el = document.getElementById(id); if (el) { if (el.type === "checkbox") el.checked = v; else el.value = v; } }
  if (S.view === "log" && openLog.length) $app.querySelectorAll("details.run").forEach((d, i) => { if (i < openLog.length) d.open = openLog[i]; });
  if (focusId) { const el = document.getElementById(focusId); if (el && el.focus) el.focus({ preventScroll: true }); }
  if (window.scrollY !== scrollTop) window.scrollTo(0, scrollTop);
}

/* ---------- actions ---------- */
function armed(btn, label, fn) {
  if (btn.dataset.armed === "1") { fn(); return; }
  btn.dataset.armed = "1"; const prev = btn.textContent; btn.textContent = label; btn.classList.add("armed");
  setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = "0"; btn.textContent = prev; btn.classList.remove("armed"); } }, 4000);
}
function readNumber(id, info) {
  const v = Number(document.getElementById(id).value);
  if (!Number.isFinite(v) || v < info.min || v > info.max) throw new Error(`${info.label} (${info.unit}) must be between ${info.min} and ${info.max}.`);
  return v;
}

$app.addEventListener("click", (ev) => {
  const t = ev.target.closest("button, a[data-view]");
  if (!t) return;
  if (t.dataset.view) { ev.preventDefault(); S.view = t.dataset.view; S.conn = S.view === "settings" ? S.conn : null;
    try { history.replaceState(null, "", "#" + S.view); } catch (e) { /* ignore */ } render(); window.scrollTo(0, 0); return; }
  switch (t.id) {
    case "kill":
      S.settings.tradingEnabled = !S.settings.tradingEnabled; save(KEY.settings, S.settings);
      toast(S.settings.tradingEnabled ? "Trading on" : "Trading paused. Every order will be blocked."); render(); return;
    case "run": runAgent(); return;
    case "send": sendNow(); return;
    case "approve-all": S.run.proposals.forEach((p) => { if (p.status === "queued") p.status = "approved"; }); persistRun(S.run); render(); return;
    case "save-rules": {
      try {
        const universe = document.getElementById("universe").value.toUpperCase().split(/[\s,]+/).filter(Boolean);
        const bad = universe.filter((s) => !/^[A-Z][A-Z.]{0,9}$/.test(s));
        if (!universe.length) throw new Error("Add at least one fund.");
        if (bad.length) throw new Error(`These don't look like tickers: ${bad.join(", ")}`);
        const benchmark = document.getElementById("benchmark").value.trim().toUpperCase();
        if (!/^[A-Z][A-Z.]{0,9}$/.test(benchmark)) throw new Error("The benchmark should be one ticker, for example SPY.");
        const limits = {};
        for (const info of C.LIMIT_INFO) limits[info.key] = readNumber("lim-" + info.key, info);
        limits.requireMarketOpen = document.getElementById("lim-requireMarketOpen").checked;
        const strategy = document.getElementById("strategy").value.trim();
        if (strategy.length < 20) throw new Error("Write out the strategy before saving.");
        S.rules = { strategy, universe: [...new Set(universe)], benchmark, limits };
        save(KEY.rules, S.rules); toast("Rules saved"); S.perf = null; refresh();
      } catch (e) { toast(e.message); }
      return;
    }
    case "reset-rules": armed(t, "Tap again to restore", () => { S.rules = clone(C.DEFAULT_RULES); save(KEY.rules, S.rules); toast("Example rules restored"); freshForm = true; render(); }); return;
    case "save-settings": case "check": {
      const st = S.settings;
      for (const k of ["keyId", "secret", "anthropicKey", "model", "relay"]) st[k] = document.getElementById(k).value.trim();
      st.askBeforeSend = document.getElementById("askBeforeSend").checked;
      st.demo = document.getElementById("demo").checked;
      if (!st.model) st.model = DEFAULT_SETTINGS.model;
      if (st.relay && !/^https:\/\//.test(st.relay)) { toast("The relay address must start with https://"); return; }
      if (!save(KEY.settings, st)) toast("This browser blocked saving. Settings last until the page closes.");
      else if (t.id === "save-settings") toast("Settings saved");
      S.snap = null; S.perf = null; S.run = null; refresh();
      if (t.id === "check") checkConnections();
      return;
    }
    case "forget": armed(t, "Tap again to forget keys", () => {
      Object.assign(S.settings, { keyId: "", secret: "", anthropicKey: "" }); save(KEY.settings, S.settings);
      S.conn = null; S.snap = null; S.perf = null; S.run = null; toast("Keys removed from this device"); freshForm = true; refresh(); }); return;
    case "export-log": {
      try {
        const blob = new Blob([JSON.stringify(S.log, null, 2)], { type: "application/json" });
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `trading-desk-log-${C.nyDate()}.json`;
        document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      } catch (e) { toast("This browser couldn't export the file"); }
      return;
    }
    case "clear-log": armed(t, "Tap again to clear", () => { S.log = []; persistLog(); toast("Log cleared"); render(); }); return;
  }
  if (t.dataset.approve || t.dataset.reject) {
    const id = Number(t.dataset.approve || t.dataset.reject);
    const p = S.run && S.run.proposals.find((x) => x.id === id);
    if (!p) return;
    const want = t.dataset.approve ? "approved" : "rejected";
    p.status = p.status === want ? "queued" : want;
    persistRun(S.run); render();
  }
});
let resizeTimer = null, lastNarrow = window.innerWidth < 560;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => {
  const n = window.innerWidth < 560; if (n !== lastNarrow && S.view === "desk") { lastNarrow = n; render(); } }, 150); });
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (["desk", "rules", "log", "settings"].includes(v) && v !== S.view) { S.view = v; render(); } });

render();
refresh();
})();
</script>
</body>
</html>
